name: Deploy Avatar

on:
  workflow_dispatch:
    inputs:
      source_ref:
        default: main
        description: app repository ref to build.
        required: false
        type: string
      source_sha:
        description: app repository commit SHA to build. Takes precedence over source_ref.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-avatar-pages
  cancel-in-progress: true

jobs:
  build:
    name: build-avatar-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve app ref
        id: app-ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ref="${SOURCE_SHA:-${SOURCE_REF:-main}}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout avatar repository
        uses: actions/checkout@v4

      - name: Checkout app package metadata
        uses: actions/checkout@v4
        with:
          repository: oneworks-ai/app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: app-source
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app-source/.node-version

      - name: Report OneWorks package versions
        id: package-versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const path = require('node:path')

          const readPackageVersion = (packagePath) => {
            const manifestPath = path.join('app-source', packagePath, 'package.json')
            return JSON.parse(fs.readFileSync(manifestPath, 'utf8')).version
          }

          console.log(`avatar=${readPackageVersion('packages/avatar')}`)
          console.log(`route_layout=${readPackageVersion('packages/route-layout')}`)
          NODE

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build avatar site
        env:
          ONEWORKS_AVATAR_BASE: /avatar/
          ONEWORKS_APP_SOURCE_DIR: app-source
        run: pnpm build:app-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
