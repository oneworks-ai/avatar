name: Deploy Avatar

on:
  workflow_run:
    workflows:
      - Avatar SDK CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && 'deploy-avatar-pages' || format('deploy-avatar-noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

jobs:
  build:
    name: build-avatar-pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      app_sha: ${{ steps.source-lock.outputs.app_sha }}
      avatar_sha: ${{ steps.source-lock.outputs.avatar_sha }}

    steps:
      - name: Checkout avatar repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Checkout shared OneWorks sources
        uses: actions/checkout@v4
        with:
          repository: oneworks-ai/app
          ref: main
          path: app-source
          fetch-depth: 0
          submodules: false

      - name: Verify immutable deployment sources
        id: source-lock
        shell: bash
        env:
          AVATAR_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual Avatar deployments may run only from protected Avatar main." >&2
            exit 1
          fi
          if [[ ! "$AVATAR_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Avatar deployment source must be a 40-character Git commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$AVATAR_SHA" ]]; then
            echo "Avatar checkout did not resolve to the CI-approved source." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$AVATAR_SHA" origin/main; then
            echo "Avatar deployment source must be reachable from protected Avatar main." >&2
            exit 1
          fi

          APP_SHA="$(git -C app-source rev-parse HEAD)"
          git -C app-source fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git -C app-source merge-base --is-ancestor "$APP_SHA" origin/main; then
            echo "Shared app source must be reachable from protected app main." >&2
            exit 1
          fi

          printf 'app_sha=%s\n' "$APP_SHA" >> "$GITHUB_OUTPUT"
          printf 'avatar_sha=%s\n' "$AVATAR_SHA" >> "$GITHUB_OUTPUT"
          {
            printf '### Deployment sources\n\n'
            printf -- '- Avatar: `%s`\n' "$AVATAR_SHA"
            printf -- '- App dependencies: `%s`\n' "$APP_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app-source/.node-version

      - name: Report OneWorks package versions
        id: package-versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const path = require('node:path')

          const readPackageVersion = (root, packagePath) => {
            const manifestPath = path.join(root, packagePath, 'package.json')
            return JSON.parse(fs.readFileSync(manifestPath, 'utf8')).version
          }

          console.log(`avatar=${readPackageVersion('.', 'packages/avatar')}`)
          console.log(`route_layout=${readPackageVersion('app-source', 'packages/route-layout')}`)
          NODE

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build avatar site
        env:
          ONEWORKS_AVATAR_BASE: /avatar/
          ONEWORKS_APP_SOURCE_DIR: app-source
        run: pnpm build:app-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
