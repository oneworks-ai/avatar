name: Deploy Avatar

on:
  workflow_dispatch:
    inputs:
      source_ref:
        default: main
        description: app repository ref to build.
        required: false
        type: string
      source_sha:
        description: app repository commit SHA to build. Takes precedence over source_ref.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-avatar-pages
  cancel-in-progress: true

jobs:
  build:
    name: build-avatar-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve app ref
        id: app-ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Avatar Pages may deploy only from the protected main branch." >&2
            exit 1
          fi
          if [[ -n "$SOURCE_REF" && "$SOURCE_REF" != "main" ]]; then
            echo "source_ref must be main when provided." >&2
            exit 1
          fi
          if [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a 40-character Git commit SHA when provided." >&2
            exit 1
          fi
          ref="${SOURCE_SHA:-main}"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout avatar repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout app package metadata
        uses: actions/checkout@v4
        with:
          repository: oneworks-ai/app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: app-source
          fetch-depth: 0
          submodules: false

      - name: Verify immutable app and avatar source
        id: source-lock
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          APP_SHA="$(git -C app-source rev-parse HEAD)"
          if [[ -n "$SOURCE_SHA" && "${APP_SHA,,}" != "${SOURCE_SHA,,}" ]]; then
            echo "Checked-out app commit does not match source_sha." >&2
            exit 1
          fi
          git -C app-source fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git -C app-source merge-base --is-ancestor "$APP_SHA" origin/main; then
            echo "App commit must be reachable from protected main." >&2
            exit 1
          fi
          mapfile -t avatar_entries < <(git -C app-source ls-tree "$APP_SHA" -- assets/avatar)
          if [[ "${#avatar_entries[@]}" -ne 1 ]]; then
            echo "App commit must contain exactly one assets/avatar gitlink." >&2
            exit 1
          fi
          gitlink_pattern=$'^160000[[:space:]]commit[[:space:]]([0-9a-fA-F]{40})\tassets/avatar$'
          if ! [[ "${avatar_entries[0]}" =~ $gitlink_pattern ]]; then
            echo "App commit must contain exactly one assets/avatar gitlink." >&2
            exit 1
          fi
          AVATAR_SHA="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$AVATAR_SHA" "$GITHUB_SHA"; then
            echo "Avatar gitlink must be reachable from protected Avatar main." >&2
            exit 1
          fi
          git checkout --detach "$AVATAR_SHA"
          if [[ "$(git rev-parse HEAD)" != "$AVATAR_SHA" ]]; then
            echo "Avatar checkout did not resolve to the app-approved gitlink." >&2
            exit 1
          fi
          if [[ "$(git -C app-source rev-parse HEAD)" != "$APP_SHA" ]]; then
            echo "Avatar checkout unexpectedly changed the app source checkout." >&2
            exit 1
          fi
          printf 'app_sha=%s\n' "$APP_SHA" >> "$GITHUB_OUTPUT"
          printf 'avatar_sha=%s\n' "$AVATAR_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app-source/.node-version

      - name: Report OneWorks package versions
        id: package-versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const path = require('node:path')

          const readPackageVersion = (root, packagePath) => {
            const manifestPath = path.join(root, packagePath, 'package.json')
            return JSON.parse(fs.readFileSync(manifestPath, 'utf8')).version
          }

          console.log(`avatar=${readPackageVersion('.', 'packages/avatar')}`)
          console.log(`route_layout=${readPackageVersion('app-source', 'packages/route-layout')}`)
          NODE

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build avatar site
        env:
          ONEWORKS_AVATAR_BASE: /avatar/
          ONEWORKS_APP_SOURCE_DIR: app-source
        run: pnpm build:app-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
