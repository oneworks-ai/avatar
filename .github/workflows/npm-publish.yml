name: Publish Avatar SDK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: true
        description: Pack and validate without publishing to npm.
        required: false
        type: boolean
      publish_tag:
        default: rc
        description: npm dist-tag for the release.
        required: true
        type: string
      auth_mode:
        default: oidc
        description: Prefer OIDC; use token only for a protected recovery publish when trusted-publisher setup is unavailable.
        required: true
        type: choice
        options:
          - oidc
          - token
      candidate_run_id:
        description: Reuse immutable tarballs from this exact successful publish-validation run.
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: avatar-sdk-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: publish-preflight
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      reuse_candidate: ${{ steps.candidate.outputs.reuse_candidate }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Require protected main and configured publishing authentication
        env:
          AUTH_MODE: ${{ inputs.auth_mode }}
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'token' && secrets.NPM_TOKEN || '' }}
          TRUSTED_PUBLISHERS: ${{ vars.NPM_TRUSTED_PUBLISHERS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          if [ "$AUTH_MODE" = 'oidc' ]; then
            test "$TRUSTED_PUBLISHERS" = '@oneworks/avatar,@oneworks/avatar-react,@oneworks/avatar-web,@oneworks/avatar-vue|oneworks-ai/avatar|npm-publish.yml|npm-publish|allow:npm-publish|token:none'
          else
            test "$AUTH_MODE" = 'token'
            test -n "$NODE_AUTH_TOKEN"
          fi

      - name: Resolve one SDK release version
        id: version
        run: |
          set -euo pipefail
          version="$(node -e "const fs=require('fs'); const files=['packages/avatar/package.json','packages/react/package.json','packages/web/package.json','packages/vue/package.json']; const versions=[...new Set(files.map(file=>JSON.parse(fs.readFileSync(file)).version))]; if(versions.length!==1) process.exit(1); process.stdout.write(versions[0])")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify candidate validation evidence
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$CANDIDATE_RUN_ID" ]; then
            echo 'reuse_candidate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100" > jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/npm-publish.yml" > workflow.json
          node scripts/verify-npm-publish-candidate.mjs run.json jobs.json artifacts.json workflow.json
          echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo 'reuse_candidate=true' >> "$GITHUB_OUTPUT"

  validate:
    name: test-pack-validate
    needs: preflight
    if: ${{ always() && (inputs.dry_run || (needs.preflight.result == 'success' && needs.preflight.outputs.reuse_candidate != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.publish.outputs.version }}

    steps:
      - name: Checkout Avatar repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout shared OneWorks sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oneworks-ai/app
          path: app-source
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app-source/.node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test editor and runtime contracts
        run: pnpm test

      - name: Build and typecheck SDK packages
        run: pnpm typecheck:sdk

      - name: Test packed packages in a clean consumer
        run: pnpm smoke:sdk

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Prepare immutable npm tarballs
        id: publish
        env:
          NPM_PUBLISH_TARBALL_DIRECTORY: ${{ runner.temp }}/avatar-sdk-tarballs
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: node scripts/publish-sdk-packages.mjs --prepare-only

      - name: Upload immutable npm tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avatar-sdk-${{ steps.publish.outputs.version }}
          path: ${{ runner.temp }}/avatar-sdk-tarballs
          if-no-files-found: error
          retention-days: 7

  reuse-candidate:
    name: verify-candidate-tarballs
    needs: preflight
    if: ${{ always() && !inputs.dry_run && needs.preflight.result == 'success' && needs.preflight.outputs.reuse_candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download candidate immutable npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avatar-sdk-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/avatar-sdk-tarballs
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate source, version, and package integrities
        env:
          NPM_PUBLISH_TARBALL_DIRECTORY: ${{ runner.temp }}/avatar-sdk-tarballs
        run: node scripts/publish-sdk-packages.mjs --verify-prepared

  publish:
    name: npm-publish-verify
    needs: [preflight, validate, reuse-candidate]
    if: ${{ always() && !inputs.dry_run && needs.preflight.result == 'success' && ((needs.validate.result == 'success' && needs['reuse-candidate'].result == 'skipped') || (needs.validate.result == 'skipped' && needs['reuse-candidate'].result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}

    steps:
      - name: Checkout validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with provenance support
        run: npm install -g npm@11.15.0

      - name: Download immutable npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avatar-sdk-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/avatar-sdk-tarballs
          run-id: ${{ needs.preflight.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded immutable npm tarballs
        env:
          NPM_PUBLISH_TARBALL_DIRECTORY: ${{ runner.temp }}/avatar-sdk-tarballs
        run: node scripts/publish-sdk-packages.mjs --verify-prepared

      - name: Create isolated npm configuration
        env:
          AUTH_MODE: ${{ inputs.auth_mode }}
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'token' && secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/avatar-npm-publish.npmrc
        run: |
          set -euo pipefail
          umask 077
          if [ "$AUTH_MODE" = 'oidc' ]; then
            printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          else
            test "$AUTH_MODE" = 'token'
            test -n "$NODE_AUTH_TOKEN"
            cat > "$NPM_CONFIG_USERCONFIG" <<'NPMRC'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
            npm whoami --registry https://registry.npmjs.org
          fi
          chmod 600 "$NPM_CONFIG_USERCONFIG"

      - name: Publish and reconcile npm packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'token' && secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/avatar-npm-publish.npmrc
          NPM_PUBLISH_TARBALL_DIRECTORY: ${{ runner.temp }}/avatar-sdk-tarballs
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: node scripts/publish-sdk-packages.mjs --publish-prepared

      - name: Remove isolated npm configuration
        if: ${{ always() }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/avatar-npm-publish.npmrc
        run: rm -f "$NPM_CONFIG_USERCONFIG"

  release:
    name: tag-sdk-release
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout published source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Create the immutable SDK release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          tag="sdk-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}')" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_args=()
            if [[ "$VERSION" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "OneWorks Avatar SDK ${VERSION}" \
              --notes "Publishes @oneworks/avatar, @oneworks/avatar-react, @oneworks/avatar-web, and @oneworks/avatar-vue with npm provenance." \
              "${release_args[@]}"
          fi
          test "$(gh release view "$tag" --json tagName --jq '.tagName')" = "$tag"
          test "$(gh release view "$tag" --json name --jq '.name')" = "OneWorks Avatar SDK ${VERSION}"
          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
          fi
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = "$expected_prerelease"
